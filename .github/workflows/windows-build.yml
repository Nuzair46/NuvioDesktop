name: Build Windows artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows MSI and portable app
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Require Dev branch
        if: github.ref != 'refs/heads/Dev'
        shell: pwsh
        run: |
          throw "This workflow must be dispatched from the Dev branch. Selected ref: $env:GITHUB_REF"

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup NuGet
        uses: nuget/setup-nuget@v3
        with:
          nuget-version: "6.x"

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version 1.0.4022.49 `
            -OutputDirectory .ci/nuget `
            -ExcludeVersion `
            -NonInteractive

      - name: Install libmpv
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ntldd

      - name: Stage libmpv runtime
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $binDir = Join-Path $env:MSYS2_LOCATION "ucrt64/bin"
          $libmpv = Join-Path $binDir "libmpv-2.dll"
          $ntldd = Join-Path $binDir "ntldd.exe"
          $runtimeDir = Join-Path $env:GITHUB_WORKSPACE ".ci/windows-runtime"

          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null

          $dependencyOutput = & $ntldd -R -D $binDir $libmpv
          if ($LASTEXITCODE -ne 0) {
            throw "ntldd failed with exit code $LASTEXITCODE."
          }
          if ($dependencyOutput -match 'not found') {
            throw "ntldd reported missing libmpv dependencies:`n$($dependencyOutput -join "`n")"
          }

          $dependencies = @($libmpv)
          foreach ($line in $dependencyOutput) {
            if ($line -match '=>\s+(.+?\.dll)\s+\(0x') {
              $dependencies += $Matches[1]
            }
          }

          $copied = @()
          foreach ($dependency in ($dependencies | Sort-Object -Unique)) {
            $resolved = (Resolve-Path -LiteralPath $dependency).Path
            if ($resolved.StartsWith($binDir, [System.StringComparison]::OrdinalIgnoreCase)) {
              Copy-Item -LiteralPath $resolved -Destination $runtimeDir -Force
              $copied += (Split-Path -Leaf $resolved)
            }
          }

          if (-not (Test-Path -LiteralPath (Join-Path $runtimeDir "libmpv-2.dll"))) {
            throw "libmpv-2.dll was not staged."
          }

          Write-Host "Staged $($copied.Count) libmpv runtime DLLs."
          $copied | Sort-Object | ForEach-Object { Write-Host "  $_" }

      - name: Generate public runtime configuration
        shell: pwsh
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID: ${{ vars.TRAKT_CLIENT_ID }}
          TRAKT_REDIRECT_URI: ${{ vars.TRAKT_REDIRECT_URI }}
          INTRODB_API_URL: ${{ vars.INTRODB_API_URL }}
          IMDB_RATINGS_API_BASE_URL: ${{ vars.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ vars.IMDB_TAPFRAME_API_BASE_URL }}
          PREMIUMIZE_CLIENT_ID: ${{ vars.PREMIUMIZE_CLIENT_ID }}
          CONTRIBUTIONS_URL: ${{ vars.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL: ${{ vars.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL: ${{ vars.DONATIONS_DONATE_URL }}
        run: |
          $propertyNames = @(
            "SUPABASE_URL",
            "SUPABASE_ANON_KEY",
            "TRAKT_CLIENT_ID",
            "TRAKT_REDIRECT_URI",
            "INTRODB_API_URL",
            "IMDB_RATINGS_API_BASE_URL",
            "IMDB_TAPFRAME_API_BASE_URL",
            "PREMIUMIZE_CLIENT_ID",
            "CONTRIBUTIONS_URL",
            "DONATIONS_BASE_URL",
            "DONATIONS_DONATE_URL"
          )

          $properties = foreach ($name in $propertyNames) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not [string]::IsNullOrWhiteSpace($value)) {
              $escaped = $value.Replace('\', '\\').Replace("`r", '\r').Replace("`n", '\n')
              "$name=$escaped"
            }
          }

          Set-Content -LiteralPath local.properties -Value $properties -Encoding utf8
          Write-Host "Generated local.properties with $($properties.Count) public values."

      - name: Build Windows release packages
        shell: pwsh
        run: |
          $webView2Dir = Join-Path $env:GITHUB_WORKSPACE ".ci/nuget/Microsoft.Web.WebView2"
          $libmpvRuntimeDir = Join-Path $env:GITHUB_WORKSPACE ".ci/windows-runtime"

          & .\gradlew.bat `
            :composeApp:createReleaseDistributable `
            :composeApp:packageReleaseMsi `
            --stacktrace `
            "-Pnuvio.webview2.dir=$webView2Dir" `
            "-Pnuvio.windows.libmpv.runtimeDir=$libmpvRuntimeDir"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Prepare downloadable artifacts
        shell: pwsh
        run: |
          $binariesDir = Join-Path $env:GITHUB_WORKSPACE "composeApp/build/compose/binaries"
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE ".ci/artifacts"

          $portableExe = Get-ChildItem -LiteralPath $binariesDir -Filter "Nuvio.exe" -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]app[\\/]' } |
            Select-Object -First 1
          if (-not $portableExe) {
            throw "A portable Nuvio.exe was not found under $binariesDir."
          }

          $msi = Get-ChildItem -LiteralPath $binariesDir -Filter "*.msi" -File -Recurse |
            Select-Object -First 1
          if (-not $msi) {
            throw "A Windows MSI was not found under $binariesDir."
          }

          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Compress-Archive `
            -Path (Join-Path $portableExe.Directory.FullName "*") `
            -DestinationPath (Join-Path $artifactDir "Nuvio-Windows-Portable.zip") `
            -CompressionLevel Optimal
          Copy-Item `
            -LiteralPath $msi.FullName `
            -Destination (Join-Path $artifactDir "Nuvio-Windows-x64.msi")

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-windows-msi
          path: .ci/artifacts/Nuvio-Windows-x64.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-windows-portable
          path: .ci/artifacts/Nuvio-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14
